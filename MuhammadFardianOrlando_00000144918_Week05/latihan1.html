<h1>Latihan 1: IF...ELSE & Function</h1>
<div class="hasil">
<script>

function cekNilai(nilai) {
    if (nilai >= 60) {
        return "Lulus";
    } else {
        return "Gagal";
    }
}

var nama = window.prompt("nama");
var nilai = window.prompt("nilai");
alert(cekNilai(nilai));
document.write(nama + " dinyatakan <b>" + cekNilai(nilai) + "</b> (nilai: " + nilai + ")");
</script>
</div>

<div class="music-control" aria-hidden="true">
  <audio id="bgMusic" autoplay loop preload="auto">
    <source src="VidsNimage/ReDreaming Angel - Sān-Z - Topic (128k).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('bgMusic');
  if (audio) {
    audio.volume = 0.35;
    audio.play().catch(() => {});
  }
});
</script>
</body></html>
