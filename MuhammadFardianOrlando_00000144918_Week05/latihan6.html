<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas 6: Bilangan Prima</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<a class="nav" href="index.html">&larr; Kembali ke menu</a>
<h1>Tugas 6: Bilangan Prima</h1>
<div class="hasil">
<script>

function isPrima(n) {
    if (n < 2) return false;
    for (var j = 2; j * j <= n; j++) {
        if (n % j === 0) return false;
    }
    return true;
}

var angka = parseInt(window.prompt("Masukkan angka"));
document.write("Bilangan prima dari 1 sampai " + angka + ":<br />");
var hasil = [];
for (var i = 1; i <= angka; i++) {
    if (isPrima(i)) hasil.push(i);
}
document.write(hasil.join(", "));
</script>
</div>

<div class="music-control" aria-hidden="true">
  <audio id="bgMusic" autoplay loop preload="auto">
    <source src="VidsNimage/ReDreaming Angel - Sān-Z - Topic (128k).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('bgMusic');
  if (audio) {
    audio.volume = 0.35;
    audio.play().catch(() => {});
  }
});
</script>
</body></html>
