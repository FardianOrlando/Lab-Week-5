<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas 4: Luas & Keliling</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<a class="nav" href="index.html">&larr; Kembali ke menu</a>
<h1>Tugas 4: Luas & Keliling</h1>
<div class="hasil">
<script>

var pilihan = "";
while (pilihan !== "luas" && pilihan !== "keliling") {
    pilihan = window.prompt("Ingin menghitung apa? Ketik \"luas\" atau \"keliling\"");
    if (pilihan === null) break; 
    pilihan = pilihan.toLowerCase().trim();
}

if (pilihan !== null) {
    var lebar = parseFloat(window.prompt("Lebar"));
    var panjang = parseFloat(window.prompt("Panjang"));
    if (pilihan === "luas") {
        document.write("Luas = " + panjang + " x " + lebar + " = <b>" + (panjang * lebar) + "</b>");
    } else {
        document.write("Keliling = 2 x (" + panjang + " + " + lebar + ") = <b>" + (2 * (panjang + lebar)) + "</b>");
    }
}
</script>
</div>

<div class="music-control" aria-hidden="true">
  <audio id="bgMusic" autoplay loop preload="auto">
    <source src="VidsNimage/ReDreaming Angel - Sān-Z - Topic (128k).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('bgMusic');
  if (audio) {
    audio.volume = 0.35;
    audio.play().catch(() => {});
  }
});
</script>
</body></html>
