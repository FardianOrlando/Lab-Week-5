<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugas 3: Salam Sesuai Jam</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<a class="nav" href="index.html">&larr; Kembali ke menu</a>
<h1>Tugas 3: Salam Sesuai Jam</h1>
<div class="hasil">
<script>

function getSalam(jam) {
    if (jam >= 6 && jam <= 10) return "Selamat Pagi";
    else if (jam >= 11 && jam <= 14) return "Selamat Siang";
    else if (jam >= 15 && jam <= 17) return "Selamat Sore";
    else if (jam >= 18 && jam <= 22) return "Selamat Malam";
    else return "Selamat Tidur"; 
}

var jam = parseInt(window.prompt("Jam Sekarang"));
if (isNaN(jam) || jam < 0 || jam > 23) {
    document.write("Jam tidak valid. Masukkan angka 0-23.");
} else {
    document.write("Jam " + jam + ":00 &rarr; <b>" + getSalam(jam) + "</b>");
}
</script>
</div>

<div class="music-control" aria-hidden="true">
  <audio id="bgMusic" autoplay loop preload="auto">
    <source src="VidsNimage/ReDreaming Angel - Sān-Z - Topic (128k).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('bgMusic');
  if (audio) {
    audio.volume = 0.35;
    audio.play().catch(() => {});
  }
});
</script>
</body></html>
